<meta name="description" content="Request access to CO Multifamily Advisors' private market intelligence dashboards.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://www.comultifamily.com/market-intelligence/">
<meta property="og:title" content="Market Intelligence Portal | CO Multifamily Advisors">
<meta property="og:description" content="Request access to CO Multifamily Advisors private market intelligence dashboards.">
<meta property="og:url" content="https://www.comultifamily.com/market-intelligence/">
<meta property="og:type" content="website">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-53BCG1FL5M"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag("js", new Date());
  gtag("config", "G-53BCG1FL5M");

<body>
<div id="site-header"></div>

<section class="section section--light" style="min-height:calc(100vh - 140px);display:flex;align-items:center;">
  <div style="width:100%;max-width:480px;margin:0 auto;padding:0 24px;">

    <div style="text-align:center;margin-bottom:32px;">
      <div style="display:inline-block;background:var(--navy);color:var(--gold);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:6px 16px;border-radius:20px;margin-bottom:20px;">Private Access</div>
      <h1 style="font-size:26px;margin-bottom:10px;">Market Intelligence Portal</h1>
      <p style="color:var(--text-soft);font-size:15px;line-height:1.6;">Request access below.</p>
    </div>

    <div style="background:var(--bg-card);border:1px solid #e2e5ea;border-radius:12px;padding:32px;" id="form-wrap">
      <form name="dashboard-access" method="POST" data-netlify="true" action="/market-intelligence/?submitted=true">
        <input type="hidden" name="form-name" value="dashboard-access">

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <input type="text" name="first-name" class="form-input" placeholder="First name" required>
          </div>
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input type="text" name="last-name" class="form-input" placeholder="Last name" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-input" placeholder="your@email.com" required>
        </div>

        <button type="submit" class="btn btn-gold" style="width:100%;justify-content:center;padding:14px;margin-top:8px;">Request Access →</button>
      </form>
    </div>

    <p style="text-align:center;font-size:12px;color:var(--text-soft);margin-top:20px;"><a href="mailto:bill.morkes@colliers.com" style="color:var(--navy);text-decoration:underline;">Questions?</a></p>

  </div>
</section>

<div id="site-footer"></div>
<script src="/js/shared.js"></script>
<script>
if (window.location.search.includes('submitted=true')) {
  document.getElementById('form-wrap').innerHTML = '<div style="padding:32px 0;text-align:center;"><div style="font-size:28px;color:var(--gold);margin-bottom:16px;">&#10003;</div><h3 style="margin-bottom:10px;">Request Received</h3><p style="color:var(--text-soft);font-size:15px;">Bill will review your request and send your private access link within one business day.</p></div>';
}
</script>
</body>
