<body>
<div class="co-topbar">
  <span class="co-wordmark">CO Multifamily Advisors</span>
  <a class="co-hub-link" data-token-link href="/dashboards/">&#8592; Back to Hub</a>
</div>
<header>
  <h1>Multifamily Deliveries by Year</h1>
  <p>Source: CO Multifamily Advisors internal database &middot; 10+ unit properties &middot; Colorado &amp; Wyoming</p>
</header>

<div class="toolbar">
  <div class="filter-group">
    <label>Market</label>
    <select id="fMsa" onchange="render()"></select>
  </div>
</div>

<div class="section" id="body">
  <div class="loading">Loading&hellip;</div>
</div>

<script>
let DATA = [];
const UC_YEAR = 9999;
const OLD_CUTOFF = 1960;

function yearLabel(y) { return y === UC_YEAR ? 'Under Construction' : y; }

function yearRows(msa) {
  const rows = DATA.filter(r => !msa || r.msa === msa);
  const byYear = {};
  rows.forEach(r => {
    const b = byYear[r.year] || (byYear[r.year] = {year:r.year, properties:0, units:0, sf_sum:0, sf_units:0});
    b.properties += r.properties;
    b.units += r.units;
    b.sf_sum += r.sf_sum;
    b.sf_units += r.sf_units;
  });
  return Object.values(byYear);
}

function cardHtml(label, r, extraClass) {
  const avgSf = r.sf_units ? Math.round(r.sf_sum / r.sf_units) : null;
  return `
    <div class="card${extraClass ? ' '+extraClass : ''}">
      <div class="card-title">${label}</div>
      <div class="metric-row"><span>Properties</span><span>${r.properties.toLocaleString()}</span></div>
      <div class="metric-row"><span>Units</span><span>${r.units.toLocaleString()}</span></div>
      <div class="metric-row"><span>Avg SF/Unit</span><span>${avgSf==null?'—':avgSf.toLocaleString()}</span></div>
    </div>`;
}

function render() {
  const msa = document.getElementById('fMsa').value;
  const rows = yearRows(msa);
  const totalProps = rows.reduce((a,r)=>a+r.properties,0);
  const totalUnits = rows.reduce((a,r)=>a+r.units,0);

  const summary = `
    <div class="summary-bar">
      <div class="summary-tile"><b>${totalProps.toLocaleString()}</b><span>Properties</span></div>
      <div class="summary-tile"><b>${totalUnits.toLocaleString()}</b><span>Units</span></div>
    </div>`;

  const ucRow = rows.find(r => r.year === UC_YEAR);
  const recentRows = rows.filter(r => r.year !== UC_YEAR && r.year >= OLD_CUTOFF).sort((a,b) => b.year - a.year);
  const oldRows = rows.filter(r => r.year < OLD_CUTOFF);

  let cards = '';
  if (ucRow) cards += cardHtml('Under Construction', ucRow, 'card-uc');
  cards += recentRows.map(r => cardHtml(String(r.year), r)).join('');
  if (oldRows.length) {
    const old = oldRows.reduce((a,r) => ({
      properties: a.properties + r.properties, units: a.units + r.units,
      sf_sum: a.sf_sum + r.sf_sum, sf_units: a.sf_units + r.sf_units,
    }), {properties:0, units:0, sf_sum:0, sf_units:0});
    cards += cardHtml(`Pre-${OLD_CUTOFF}`, old);
  }

  document.getElementById('body').innerHTML = summary + cards;
}

fetch('/dashboards/deliveries-by-year/data.json')
  .then(r => r.json())
  .then(d => {
    DATA = d;
    const msas = [...new Set(DATA.map(r=>r.msa))].sort();
    const fm = document.getElementById('fMsa');
    fm.innerHTML = '<option value="">All Markets</option>' + msas.map(m => `<option value="${m}">${m}</option>`).join('');
    render();
  });

</script>
</body>
