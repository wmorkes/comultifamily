<option value="Denver">Denver</option>

<div class="section">

    <div class="filter-group" style="gap:0">
      <select id="fYear" onchange="applyFilters()" style="padding:2px 6px"></select>
    </div>
  </div>
  <div id="tableWrap">
    <table id="vintageTable">
      <thead>
        <tr id="tableGroupHead"></tr>

<script>
let DATA = [];
let filtered = [];
let sortCol = 'vintage', sortDir = 1;
const NOW = new Date();
const CURRENT_YEAR = NOW.getFullYear();
const CURRENT_MONTH = NOW.getMonth() + 1;

const VINTAGE_ORDER = ['2020s-Now','2010s','2000s','1990s','1980s','1970s & Older','Unknown'];

const COLS = [
  {key:'vintage',      label:'Vintage',        fmt:v=>v},
  {key:'deals',        label:'Sales',          fmt:v=>v.toLocaleString()},
  {key:'volume',       label:'Total Volume',   fmt:v=>dollar(v)},
  {key:'avgPrice',     label:'Avg Price',      fmt:v=>v==null?'—':dollar(v)},
  {key:'pricePerUnit', label:'Avg $/Unit',     fmt:v=>v==null?'—':dollar(v)},
  {key:'pricePerSF',   label:'Avg $/SF',       fmt:v=>v==null?'—':'$'+Math.round(v)},
  {key:'vsYtd',        label:'vs YTD',         fmt:v=>fmtPct(v)},
  {key:'vs2021',       label:'vs 2021 (YTD)',  fmt:v=>fmtPct(v)},
  {key:'vs2019',       label:'vs 2019 (YTD)',  fmt:v=>fmtPct(v)},
];
const SF_GROUP_START = 5; // index of 'pricePerSF' — first column in the $/SF group

function dollar(v) { return '$'+Math.round(v).toLocaleString(); }

const head = document.getElementById('tableHead');
COLS.forEach((c,i) => {
  const th = document.createElement('th');
  th.innerHTML = c.label + '<span class="sort-arrow">&#8597;</span>';
  if(i>=SF_GROUP_START) th.classList.add('sf-group');
  th.onclick = () => {
    if(sortCol===c.key) sortDir*=-1; else {sortCol=c.key;sortDir=1;}
    renderTable();
  };
  head.appendChild(th);
});

const groupHead = document.getElementById('tableGroupHead');
groupHead.innerHTML =
  `<th colspan="${SF_GROUP_START}"></th>` +
  `<th colspan="${COLS.length-SF_GROUP_START}" class="sf-group-title">Price / SF</th>`;

function applyFilters() {
  const region = document.getElementById('fRegion').value;
  const year   = parseInt(document.getElementById('fYear').value);
  // Full year for the table's displayed figures — no month cutoff. (For the
  // current year this is naturally YTD since later months have no data yet.)
  filtered = DATA.filter(r => (!region || r.region===region) && r.year===year);
  renderTable();
  renderChart();
}

function clearFilters() {
  document.getElementById('fRegion').value = '';
  document.getElementById('fYear').value = String(CURRENT_YEAR);
  applyFilters();
}

function vintagePPSFMap(year, region) {
  const rows = DATA.filter(r => (!region || r.region===region) && r.year===year && r.month<=CURRENT_MONTH);
  const byV = {};
  rows.forEach(r => {
    const b = byV[r.vintage] || (byV[r.vintage] = {sfPriced:0, sfVolume:0});
    b.sfPriced += r.sfPriced;
    b.sfVolume += r.sfVolume;
  });
  const out = {};
  Object.keys(byV).forEach(v => { out[v] = byV[v].sfPriced ? byV[v].sfVolume/byV[v].sfPriced : null; });
  return out;
}

function vintageRows() {
  const region = document.getElementById('fRegion').value;
  const selectedYear = parseInt(document.getElementById('fYear').value);

  const byVintage = {};
  filtered.forEach(r => {
    const b = byVintage[r.vintage] || (byVintage[r.vintage] = {
      vintage:r.vintage, deals:0, pricedDeals:0, volume:0, unitsPriced:0, sfPriced:0, sfVolume:0
    });
    b.deals += r.deals;
    b.pricedDeals += r.pricedDeals;
    b.volume += r.volume;
    b.unitsPriced += r.unitsPriced;
    b.sfPriced += r.sfPriced;
    b.sfVolume += r.sfVolume;
  });

  // Comparison columns use a separate, consistent "through current month" cutoff
  // on both sides — independent of the full-year figures shown in the table —
  // so the % changes stay apples-to-apples regardless of which year is selected.
  const selectedYtdMap = vintagePPSFMap(selectedYear, region);
  const ytdMap  = selectedYear!==CURRENT_YEAR ? vintagePPSFMap(CURRENT_YEAR, region) : null;
  const map2021 = selectedYear!==2021         ? vintagePPSFMap(2021, region)         : null;
  const map2019 = selectedYear!==2019         ? vintagePPSFMap(2019, region)         : null;

  return Object.values(byVintage).map(b => {
    const ppsf = b.sfPriced ? b.sfVolume/b.sfPriced : null;
    const ppsfYtd = selectedYtdMap[b.vintage];
    return {
      vintage: b.vintage,
      deals: b.deals,
      volume: b.volume,
      avgPrice: b.pricedDeals ? Math.round(b.volume/b.pricedDeals) : null,
      pricePerUnit: b.unitsPriced ? Math.round(b.volume/b.unitsPriced) : null,
      pricePerSF: ppsf,
      vsYtd:  ytdMap  ? pctChange(ppsfYtd, ytdMap[b.vintage])  : null,
      vs2021: map2021 ? pctChange(ppsfYtd, map2021[b.vintage]) : null,
      vs2019: map2019 ? pctChange(ppsfYtd, map2019[b.vintage]) : null,
    };
  });
}

function renderTable() {
  const rows = vintageRows();
  const sorted = rows.sort((a,b) => {
    if(sortCol==='vintage') {
      const d = VINTAGE_ORDER.indexOf(a.vintage) - VINTAGE_ORDER.indexOf(b.vintage);
      return sortDir<0 ? -d : d;
    }
    const av=a[sortCol], bv=b[sortCol];
    if(av==null) return 1; if(bv==null) return -1;
    return av<bv?-sortDir:av>bv?sortDir:0;
  });

  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = sorted.map(r =>
    '<tr>' + COLS.map((c,i)=>`<td${i>=SF_GROUP_START?' class="sf-group"':''}>${c.fmt(r[c.key])}</td>`).join('') + '</tr>'
  ).join('');

  document.getElementById('pagination').innerHTML = '';
}

function renderStats() {
  // Full history for the region (not the single selected Year) — the summary
  // is a stable reference point, same reasoning as the always-full-range chart.
  const region = document.getElementById('fRegion').value;
  const regionAll = DATA.filter(r => !region || r.region===region);
  const totalDeals = regionAll.reduce((a,r)=>a+r.deals,0);
  const totalVol = regionAll.reduce((a,r)=>a+r.volume,0);
  const el = document.getElementById('statsSummary');
  el.innerHTML = `
    <div class="stat-title">Summary${region?' — '+region:''}</div>
    <div class="stat-row"><b>${dollar(totalVol)}</b><span>Total Volume</span></div>
    <div class="stat-row"><b>${totalDeals.toLocaleString()}</b><span>Total Sales</span></div>
  `;
  renderYTDCompare();
}

function shortDollar(v) {
  if(Math.abs(v) >= 1e9) return '$'+Math.round(v/1e9)+'B';
  if(Math.abs(v) >= 1e6) return '$'+Math.round(v/1e6)+'M';
  return dollar(v);
}

function pctChange(cur, base) {
  if(!base) return null;
  return (cur-base)/base*100;
}

function fmtPct(v) {
  if(v===null) return '<span style="color:#bbb">—</span>';
  const r = Math.round(v);
  const cls = r<0 ? 'neg' : (r>10 ? 'pos' : '');
  const span = cls ? '<span class="'+cls+'">' : '<span>';
  return span+(r>=0?'+':'')+r+'%</span>';
}

function renderYTDCompare() {
  const region = document.getElementById('fRegion').value;
  const regionData = DATA.filter(r => !region || r.region===region);

  function sumThroughMonth(year, monthCutoff) {
    const rows = regionData.filter(r => r.year===year && r.month<=monthCutoff);
    const sfPriced = rows.reduce((a,r)=>a+r.sfPriced,0);
    const sfVolume = rows.reduce((a,r)=>a+r.sfVolume,0);
    return {
      volume: rows.reduce((a,r)=>a+r.volume,0),
      deals: rows.reduce((a,r)=>a+r.deals,0),
      ppsf: sfPriced ? sfVolume/sfPriced : null,
    };
  }

  const ytd = sumThroughMonth(CURRENT_YEAR, CURRENT_MONTH);
  const monthName = NOW.toLocaleString('en-US', {month:'short'});
  const compareYears = [
    {label:'vs Last Year', year: CURRENT_YEAR-1},
    {label:'vs 2021', year: 2021},
    {label:'vs 2019', year: 2019},
  ].filter(cy => cy.year < CURRENT_YEAR);

  document.getElementById('ytdCompareTitle').textContent = `YTD Comparison (thru ${monthName})`;

  const metrics = [
    {label:'Volume', key:'volume'},
    {label:'Sales', key:'deals'},
    {label:'$/SF', key:'ppsf'},
  ];

  const headHtml = '<th></th>' + compareYears.map(cy=>`<th>${cy.label}</th>`).join('');
  const bodyHtml = metrics.map(m => {
    const cells = compareYears.map(cy => {
      const cmp = sumThroughMonth(cy.year, CURRENT_MONTH);
      const chg = pctChange(ytd[m.key], cmp[m.key]);
      return `<td>${fmtPct(chg)}</td>`;
    }).join('');
    return `<tr><td>${m.label}</td>${cells}</tr>`;
  }).join('');

  document.getElementById('ytdCompare').innerHTML =
    `<table class="compare-table"><thead><tr>${headHtml}</tr></thead><tbody>${bodyHtml}</tbody></table>` +
    `<div class="compare-footnote">YTD ${CURRENT_YEAR}: ${shortDollar(ytd.volume)} vol &middot; ${ytd.deals} sales${ytd.ppsf?' &middot; $'+ytd.ppsf.toFixed(0)+'/SF':''}</div>`;
}

function renderChart() {
  renderStats();
  // Chart always spans the full dataset — it's a trend line, so Year From/To
  // (which only narrows the table below) shouldn't crop it. Region still applies.
  const region = document.getElementById('fRegion').value;
  const chartData = DATA.filter(r => !region || r.region===region);
  const years = [...new Set(DATA.map(r=>r.year))].sort((a,b)=>a-b);

  const counts = years.map(y => chartData.filter(r=>r.year===y).reduce((a,r)=>a+r.deals,0));
  const vols   = years.map(y => chartData.filter(r=>r.year===y).reduce((a,r)=>a+r.volume,0));

  const W=880, H=440, PL=70, PR=70, PT=20, PB=50;
  const cW=W-PL-PR, cH=H-PT-PB;
  const barW = cW/years.length*0.6;

  const maxCount = Math.max(1, ...counts);
  // Base unit is $250M (per Bill's spec), but step up through nice multiples so
  // wide-scope views (e.g. All Regions, which can top $13B in a peak year) don't
  // end up with 50+ gridlines.
  const VOL_STEP_CANDIDATES = [250e6, 500e6, 750e6, 1e9, 2e9, 3e9, 5e9, 10e9, 25e9];
  const rawMaxVol = Math.max(1, ...vols);
  const VOL_STEP = VOL_STEP_CANDIDATES.find(step => Math.ceil(rawMaxVol/step) <= 8) || 25e9;
  const volSteps = Math.max(1, Math.ceil(rawMaxVol / VOL_STEP));
  const axisMaxVol = volSteps * VOL_STEP;
  const xScale = i => PL + (i+0.5)/years.length*cW;
  const yCount = v => PT + cH - (v/maxCount)*cH;
  const yVol   = v => PT + cH - (v/axisMaxVol)*cH;

  function fmtAxisVol(v) {
    if(v >= 1e9) return '$'+Math.round(v/1e9)+'B';
    return '$'+Math.round(v/1e6)+'M';
  }

  let parts = [];
  for(let i=0;i<=5;i++) {
    const v = maxCount*(i/5), y=yCount(v);
    parts.push('<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="#eee" stroke-width="1"/>');
    parts.push('<text x="'+(PL-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="#888">'+Math.round(v)+'</text>');
  }
  for(let i=1;i<=volSteps;i++) {
    const v = i*VOL_STEP, y=yVol(v);
    parts.push('<text x="'+(W-PR+6)+'" y="'+(y+4)+'" text-anchor="start" font-size="10" fill="#888">'+fmtAxisVol(v)+'</text>');
  }

  years.forEach((yr,i)=>{
    const x=xScale(i);
    parts.push('<text x="'+x+'" y="'+(H-PT+4)+'" text-anchor="middle" font-size="10" fill="#888">'+yr+(yr===CURRENT_YEAR?' *':'')+'</text>');
  });

  const tips = [];
  years.forEach((yr,i)=>{
    const x=xScale(i)-barW/2, y=yCount(counts[i]), h=cH+PT-y;
    parts.push('<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+h+'" fill="#c9a84c" rx="2" class="bar" data-tip="'+yr+'\nSales: '+counts[i]+'\nVolume: $'+Math.round(vols[i]).toLocaleString()+'"/>');
  });

  const volPts = years.map((yr,i)=>({x:xScale(i), y:yVol(vols[i])}));
  const d = volPts.map((p,i)=>(i===0?'M':'L')+p.x+','+p.y).join(' ');
  parts.push('<path d="'+d+'" fill="none" stroke="#0c1a2e" stroke-width="2.5"/>');
  volPts.forEach((p,i)=>{
    parts.push('<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="#0c1a2e" stroke="#fff" stroke-width="1.5" class="bar" data-tip="'+years[i]+'\nSales: '+counts[i]+'\nVolume: $'+Math.round(vols[i]).toLocaleString()+'"/>');
  });

  parts.push('<line x1="'+PL+'" y1="'+PT+'" x2="'+PL+'" y2="'+(PT+cH)+'" stroke="#ccc" stroke-width="1"/>');
  parts.push('<line x1="'+PL+'" y1="'+(PT+cH)+'" x2="'+(W-PR)+'" y2="'+(PT+cH)+'" stroke="#ccc" stroke-width="1"/>');
  if(years.includes(CURRENT_YEAR)) {
    parts.push('<text x="'+(PL+cW/2)+'" y="'+(H-2)+'" text-anchor="middle" font-size="10" fill="#aaa">* partial year</text>');
  }

  const svg = document.getElementById('chart');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.innerHTML = parts.join('');

  document.getElementById('chartLegend').innerHTML =
    '<div class="legend-item"><div class="legend-swatch" style="background:#c9a84c"></div>Sales Count (left axis)</div>' +
    '<div class="legend-item"><div class="legend-swatch" style="background:#0c1a2e"></div>Total Volume $ (right axis)</div>';

  const tooltip = document.getElementById('tooltip');
  svg.querySelectorAll('.bar').forEach(el=>{
    el.addEventListener('mousemove',e=>{
      tooltip.style.display='block';
      tooltip.style.left=(e.clientX+12)+'px';
      tooltip.style.top=(e.clientY-30)+'px';
      tooltip.textContent=el.getAttribute('data-tip');
    });
    el.addEventListener('mouseleave',()=>{tooltip.style.display='none';});
  });
}

fetch('/dashboards/sales-by-year/data.json')
  .then(r => r.json())
  .then(d => {
    DATA = d;
    const years = [...new Set(DATA.map(r=>r.year))].sort((a,b)=>b-a);
    const fy = document.getElementById('fYear');
    years.forEach(y => {
      fy.innerHTML += `<option value="${y}">${y}</option>`;
    });
    fy.value = String(CURRENT_YEAR);
    applyFilters();
  });

(function() {
  const token = new URLSearchParams(location.search).get('token');
  if (token) {
    const el = document.getElementById('hubBackLink');
    if (el) el.href = '/dashboards/?token=' + encodeURIComponent(token);
  }
})();
</script>
