<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;width:100%}
body{font-family:system-ui,sans-serif;font-size:14px;background:#f4f6f9;color:#222}
.co-topbar{background:#0c1a2e;border-bottom:2px solid #c9a84c;padding:8px 14px;display:flex;align-items:center;justify-content:space-between}
.co-wordmark{font-size:11px;font-weight:700;color:#c9a84c;letter-spacing:.06em;text-transform:uppercase}
.co-hub-link{font-size:11px;color:rgba(255,255,255,.7);text-decoration:none}
header{background:#0c1a2e;color:#fff;padding:12px 14px}
header h1{font-size:15px;font-weight:600}
header p{font-size:11px;opacity:.7;margin-top:3px;line-height:1.4}
.toolbar{padding:12px 14px;background:#fff;border-bottom:1px solid #dde}
.filter-group{display:flex;flex-direction:column;gap:4px}
.filter-group label{font-size:11px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.4px}
select{border:1px solid #ccd;border-radius:6px;padding:10px;font-size:15px;background:#fff;color:#222;width:100%}
.section{padding:12px 14px}
.summary-bar{display:flex;gap:10px;margin-bottom:12px}
.summary-tile{flex:1;background:#fff;border:1px solid #dde;border-radius:8px;padding:10px;text-align:center}
.summary-tile b{display:block;font-size:16px;color:#0c1a2e}
.summary-tile span{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:.3px}
.card{background:#fff;border:1px solid #dde;border-radius:8px;padding:12px 14px;margin-bottom:10px}
.card-title{font-size:14px;font-weight:700;color:#0c1a2e;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #eef}
.metric-row{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.metric-row span:first-child{color:#666}
.metric-row span:last-child{font-weight:600}
.metric-row.compare span:first-child{font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.pos{color:#1a7a3c;font-weight:700}
.neg{color:#c0392b;font-weight:700}
.compare-note{font-size:11px;color:#888;margin:-4px 0 12px}
.loading{text-align:center;padding:30px;color:#888;font-size:13px}
</style>

<body>
<div class="co-topbar">
  <span class="co-wordmark">CO Multifamily Advisors</span>
  <a class="co-hub-link" id="hubBackLink" href="/dashboards/">&#8592; Back to Hub</a>
</div>
<header>
  <h1>Multifamily Sales by Vintage</h1>
  <p>Source: CO Multifamily Advisors internal database &middot; 10+ unit properties &middot; Denver, Colorado Springs, Northern CO, Pueblo, CO Mountain Towns</p>
</header>

<div class="toolbar">
  <div class="filter-group">
    <label>Year</label>
    <select id="fYear" onchange="render()"></select>
  </div>
</div>

<div class="section" id="body">
  <div class="loading">Loading&hellip;</div>
</div>

<script>
let DATA = [];
const VINTAGE_ORDER = ['2020s-Now','2010s','2000s','1990s','1980s','1970s & Older','Unknown'];
const NOW = new Date();
const CURRENT_YEAR = NOW.getFullYear();
const CURRENT_MONTH = NOW.getMonth() + 1;

function dollar(v) { return '$'+Math.round(v).toLocaleString(); }
function shortDollar(v) {
  if(Math.abs(v) >= 1e9) return '$'+(v/1e9).toFixed(1)+'B';
  if(Math.abs(v) >= 1e6) return '$'+Math.round(v/1e6)+'M';
  return dollar(v);
}

function pctChange(cur, base) {
  if(!base) return null;
  return (cur-base)/base*100;
}

function fmtPct(v) {
  if(v==null) return '<span style="color:#bbb">—</span>';
  const r = Math.round(v);
  const cls = r<0 ? 'neg' : (r>10 ? 'pos' : '');
  const span = cls ? '<span class="'+cls+'">' : '<span>';
  return span+(r>=0?'+':'')+r+'%</span>';
}

// $/SF by vintage for a given year, optionally cut off through CURRENT_MONTH
// (for the current/YTD side of a comparison) or the full year (for a past,
// already-complete year) — mirrors the desktop dashboard's YTD-cutoff logic.
function vintagePPSFMap(year, ytdOnly) {
  const rows = DATA.filter(r => r.year === year && (!ytdOnly || r.month <= CURRENT_MONTH));
  const byV = {};
  rows.forEach(r => {
    const b = byV[r.vintage] || (byV[r.vintage] = {sfPriced:0, sfVolume:0});
    b.sfPriced += r.sfPriced;
    b.sfVolume += r.sfVolume;
  });
  const out = {};
  Object.keys(byV).forEach(v => { out[v] = byV[v].sfPriced ? byV[v].sfVolume/byV[v].sfPriced : null; });
  return out;
}

function vintageRows(year) {
  const rows = DATA.filter(r => r.year === year);
  const byVintage = {};
  rows.forEach(r => {
    const b = byVintage[r.vintage] || (byVintage[r.vintage] = {
      vintage:r.vintage, deals:0, pricedDeals:0, volume:0, unitsPriced:0, sfPriced:0, sfVolume:0
    });
    b.deals += r.deals;
    b.pricedDeals += r.pricedDeals;
    b.volume += r.volume;
    b.unitsPriced += r.unitsPriced;
    b.sfPriced += r.sfPriced;
    b.sfVolume += r.sfVolume;
  });
  return Object.values(byVintage).map(b => ({
    vintage: b.vintage,
    deals: b.deals,
    volume: b.volume,
    pricePerUnit: b.unitsPriced ? Math.round(b.volume/b.unitsPriced) : null,
    pricePerSF: b.sfPriced ? b.sfVolume/b.sfPriced : null,
  })).sort((a,b) => VINTAGE_ORDER.indexOf(a.vintage) - VINTAGE_ORDER.indexOf(b.vintage));
}

function render() {
  const year = parseInt(document.getElementById('fYear').value);
  const rows = vintageRows(year);
  const totalDeals = rows.reduce((a,r)=>a+r.deals,0);
  const totalVol = rows.reduce((a,r)=>a+r.volume,0);

  // Comparison: on the current year, compare YTD $/SF to last year's YTD
  // (same cutoff, apples-to-apples). On a past year, compare this year's YTD
  // $/SF to that year's full-year figure (the past year has no partial data),
  // so the label calls out it's a partial-vs-full comparison.
  const isCurrent = year === CURRENT_YEAR;
  const monthName = NOW.toLocaleString('en-US', {month:'long'});
  let compareLabel, compareNote, curMap, baseMap;
  if (isCurrent) {
    curMap = vintagePPSFMap(CURRENT_YEAR, true);
    baseMap = vintagePPSFMap(CURRENT_YEAR - 1, true);
    compareLabel = `vs ${CURRENT_YEAR - 1} YTD (thru ${monthName})`;
    compareNote = null;
  } else {
    curMap = vintagePPSFMap(CURRENT_YEAR, true);
    baseMap = vintagePPSFMap(year, false);
    compareLabel = `${CURRENT_YEAR} YTD vs full ${year}`;
    compareNote = `${CURRENT_YEAR} thru ${monthName} compared to all of ${year}`;
  }

  const summary = `
    <div class="summary-bar">
      <div class="summary-tile"><b>${shortDollar(totalVol)}</b><span>Total Volume</span></div>
      <div class="summary-tile"><b>${totalDeals.toLocaleString()}</b><span>Total Sales</span></div>
    </div>
    ${compareNote ? `<div class="compare-note">${compareNote} ($/SF)</div>` : ''}`;

  const cards = rows.map(r => {
    const chg = pctChange(curMap[r.vintage], baseMap[r.vintage]);
    return `
    <div class="card">
      <div class="card-title">${r.vintage}</div>
      <div class="metric-row"><span>Sales</span><span>${r.deals.toLocaleString()}</span></div>
      <div class="metric-row"><span>Total Volume</span><span>${dollar(r.volume)}</span></div>
      <div class="metric-row"><span>Avg $/Unit</span><span>${r.pricePerUnit==null?'—':dollar(r.pricePerUnit)}</span></div>
      <div class="metric-row"><span>Avg $/SF</span><span>${r.pricePerSF==null?'—':'$'+Math.round(r.pricePerSF)}</span></div>
      <div class="metric-row compare"><span>${compareLabel}</span><span>${fmtPct(chg)}</span></div>
    </div>`;
  }).join('');

  document.getElementById('body').innerHTML = summary + cards;
}

fetch('/dashboards/sales-by-year/data.json')
  .then(r => r.json())
  .then(d => {
    DATA = d;
    const years = [...new Set(DATA.map(r=>r.year))].sort((a,b)=>b-a);
    const fy = document.getElementById('fYear');
    fy.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');
    render();
  });

(function() {
  const token = new URLSearchParams(location.search).get('token');
  if (token) {
    const el = document.getElementById('hubBackLink');
    if (el) el.href = '/dashboards/?token=' + encodeURIComponent(token);
  }
})();
</script>
</body>
</html>
