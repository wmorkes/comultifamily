body{font-family:system-ui,sans-serif;background:#f4f6f9;color:#222;-webkit-text-size-adjust:100%}
.co-topbar{background:#0c1a2e;border-bottom:2px solid #c9a84c;padding:7px 14px;display:flex;align-items:center;justify-content:space-between}
.co-wordmark{font-size:11px;font-weight:700;color:#c9a84c;letter-spacing:.06em;text-transform:uppercase}
.co-hub-link{font-size:11px;color:rgba(255,255,255,.75);text-decoration:none}
header{background:#0c1a2e;color:#fff;padding:10px 14px}
header h1{font-size:14px;font-weight:600}
header p{font-size:11px;opacity:.7;margin-top:2px;line-height:1.4}
.page{max-width:560px;margin:0 auto;padding:10px 14px}
.filter-group{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.filter-group label{font-size:10px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.4px}
select{border:1px solid #ccd;border-radius:8px;padding:9px 10px;font-size:14px;background:#fff;color:#222;width:100%}
.empty-state{text-align:center;color:#888;font-size:13px;padding:20px 16px}
.summary-row{display:flex;gap:8px;margin-bottom:10px}
.summary-card{flex:1;background:#fff;border:1px solid #dde;border-radius:8px;padding:9px 10px;border-top:3px solid #888}
.summary-card.uc{border-top-color:#e53e3e}

.summary-label{font-size:9.5px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.summary-stat{display:flex;align-items:baseline;gap:4px;margin-top:2px;flex-wrap:wrap}
.summary-stat .n{font-size:16px;font-weight:700;color:#0c1a2e}
.summary-stat .k{font-size:9.5px;color:#888;text-transform:uppercase;letter-spacing:.3px;margin-right:8px}
footer{font-size:9px;color:#999;padding:8px 14px;text-align:center}
#mapWrap{height:48vh;border-top:2px solid #c9a84c}
#map{width:100%;height:100%}
.leaflet-popup-content{font-size:12px;line-height:1.6}

  gtag("config", "G-53BCG1FL5M");

<body>
<div class="co-topbar">
  <span class="co-wordmark">CO Multifamily Advisors</span>
  <a class="co-hub-link" href="/dashboards/" data-token-link>&#8592; Back to Hub</a>
</div>
<header>
  <h1>Pipeline Market Search</h1>
  <p>Select a market to see new construction pipeline on the map.</p>
</header>
<div class="page">
  <div class="filter-group">
    <label for="marketSelect">Market</label>
    <select id="marketSelect"><option value="">All Markets</option></select>
  </div>
  <div id="summary"></div>
</div>
<div id="mapWrap"><div id="map"></div></div>
<footer>CO/WY Multifamily New Construction Pipeline &middot; <a href="/dashboards/pipeline/" style="color:#999" data-token-link>Full desktop dashboard &rarr;</a></footer>

<script>
const STAGE_COLORS = { under_construction: '#e53e3e', planned: '#dd6b20', prospective: '#3182ce' };
const SOURCE_META = {
  ai: { style: 'background:#1b5e3a;color:#fff', short: 'AI' },
  yardi: { style: 'background:#4a90c9;color:#fff', short: 'Yardi' },
  costar: { style: 'background:#0f4c81;color:#fff', short: 'CoStar' }
};
const MARKET_ORDER = ['Denver Metro', 'Boulder', 'Fort Collins', 'Greeley', 'Colorado Springs', 'Pueblo', 'Western Slope', 'Mountain Towns', 'Rural/Tertiary CO', 'Wyoming'];
let GEO = null;

const map = L.map('map', { zoomControl: true, attributionControl: false }).setView([39.5, -105.5], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);
const markerLayer = L.layerGroup().addTo(map);

function populateMarkets() {
  const select = document.getElementById('marketSelect');
  const present = new Set(GEO.features.map(f => f.properties.market).filter(Boolean));
  const ordered = MARKET_ORDER.filter(m => present.has(m));
  present.forEach(m => { if (!ordered.includes(m)) ordered.push(m); });
  ordered.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = m;
    select.appendChild(opt);
  });
}

function updateMap(matches) {
  markerLayer.clearLayers();
  if (!matches.length) return;
  const bounds = [];
  matches.forEach(p => {
    const [lng, lat] = GEO.features.find(f => f.properties.idx === p.idx).geometry.coordinates;
    const color = STAGE_COLORS[p.stage] || '#888';
    const icon = L.divIcon({
      html: `<div style="background:${color};width:14px;height:14px;border-radius:50%;border:2px solid white;box-shadow:0 1px 3px rgba(0,0,0,.4)"></div>`,
      className: '', iconSize: [14, 14], iconAnchor: [7, 7]
    });
    const addrLine = [p.address, [p.city, p.state].filter(Boolean).join(', ')].filter(Boolean).join(' &middot; ');
    const src = SOURCE_META[p.source] || { style: 'background:#888;color:#fff', short: p.source || '—' };
    const srcBadge = `<span style="${src.style};font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px">${src.short}</span>`;
    L.marker([lat, lng], { icon })
      .bindPopup(`<strong>${p.name}</strong> ${srcBadge}${addrLine ? `<br>${addrLine}` : ''}<br>${p.stage_label || p.stage} &middot; ${p.units || '—'} units<br>${p.developer || '—'}`)
      .addTo(markerLayer);
    bounds.push([lat, lng]);
  });
  map.fitBounds(bounds, { padding: [30, 30], maxZoom: 14 });
}

function renderSummary(matches) {
  const el = document.getElementById('summary');
  if (!matches.length) {
    el.innerHTML = '<div class="empty-state">No pipeline properties in this market.</div>';
    return;
  }
  const groups = { uc: { props: 0, units: 0 }, pp: { props: 0, units: 0 } };
  matches.forEach(p => {
    const g = p.stage === 'under_construction' ? groups.uc : groups.pp;
    g.props += 1;
    g.units += (+p.units || 0);
  });
  el.innerHTML = `
    <div class="summary-row">
      <div class="summary-card uc">
        <div class="summary-label">Under Construction</div>
        <div class="summary-stat"><span class="n">${groups.uc.props}</span><span class="k">Props</span><span class="n">${groups.uc.units.toLocaleString()}</span><span class="k">Units</span></div>
      </div>
      <div class="summary-card pp">
        <div class="summary-label">Planned + Prospective</div>
        <div class="summary-stat"><span class="n">${groups.pp.props}</span><span class="k">Props</span><span class="n">${groups.pp.units.toLocaleString()}</span><span class="k">Units</span></div>
      </div>
    </div>`;
}

function renderResults() {
  const selected = document.getElementById('marketSelect').value;
  const matches = GEO.features
    .map(f => f.properties)
    .filter(p => !selected || p.market === selected);
  renderSummary(matches);
  updateMap(matches);
}

fetchDashboardData('pipeline', 'geo.json', __t)
  .then(d => { GEO = d; populateMarkets(); renderResults(); });

document.getElementById('marketSelect').addEventListener('change', renderResults);
</script>
</body>
